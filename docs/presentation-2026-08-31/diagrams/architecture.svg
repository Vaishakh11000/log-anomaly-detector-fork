<text x="130.0" y="87.25" text-anchor="middle" font-size="12.5" fill="#1e3a1e">/var/log/auth.log</text>
<rect x="14" y="122" width="232" height="64" rx="9" fill="#e8f2e8" stroke="#3f7d3f" stroke-width="2"/>
<text x="130.0" y="146.75" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a1e">journald</text>
<text x="130.0" y="163.25" text-anchor="middle" font-size="12.5" fill="#1e3a1e">this machine's own journal</text>
