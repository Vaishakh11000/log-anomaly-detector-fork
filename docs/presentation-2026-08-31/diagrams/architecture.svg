<text x="130.0" y="222.75" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a1e">Paced replay</text>
<text x="130.0" y="239.25" text-anchor="middle" font-size="12.5" fill="#1e3a1e">a recording, at real speed</text>
<rect x="14" y="282" width="232" height="78" rx="9" fill="#fbf3d9" stroke="#9b7a1a" stroke-width="2"/>
<text x="130.0" y="305.5" text-anchor="middle" font-size="15" font-weight="600" fill="#4d3c05">Saved detector model</text>
<text x="130.0" y="322.0" text-anchor="middle" font-size="12.5" fill="#4d3c05">fitted once on history;</text>
<text x="130.0" y="338.5" text-anchor="middle" font-size="12.5" fill="#4d3c05">fingerprint checked on load</text>
<rect x="288" y="46" width="336" height="64" rx="9" fill="#e6eef8" stroke="#2c5f9e" stroke-width="2"/>
<text x="456.0" y="70.75" text-anchor="middle" font-size="15" font-weight="600" fill="#12304f">Parser</text>
<text x="456.0" y="87.25" text-anchor="middle" font-size="12.5" fill="#12304f">one common event shape · OpenSSH 100% · Linux 99.4%</text>
<rect x="288" y="122" width="336" height="64" rx="9" fill="#e6eef8" stroke="#2c5f9e" stroke-width="2"/>
<text x="456.0" y="146.75" text-anchor="middle" font-size="15" font-weight="600" fill="#12304f">Streaming processor</text>
<text x="456.0" y="163.25" text-anchor="middle" font-size="12.5" fill="#12304f">a batch every 50 lines or 5 seconds</text>
<rect x="288" y="198" width="336" height="64" rx="9" fill="#f0e8f6" stroke="#7a4a9e" stroke-width="2"/>
<text x="456.0" y="222.75" text-anchor="middle" font-size="15" font-weight="600" fill="#3d2352">Embedding + Isolation Forest</text>
<text x="456.0" y="239.25" text-anchor="middle" font-size="12.5" fill="#3d2352">scores the stream, never refits</text>
<rect x="288" y="274" width="336" height="64" rx="9" fill="#e6eef8" stroke="#2c5f9e" stroke-width="2"/>
<text x="456.0" y="298.75" text-anchor="middle" font-size="15" font-weight="600" fill="#12304f">Incidents + MITRE technique</text>
<text x="456.0" y="315.25" text-anchor="middle" font-size="12.5" fill="#12304f">grouping · impossible travel · lookup table</text>
<rect x="666" y="46" width="300" height="64" rx="9" fill="#dfe8f5" stroke="#1e3f66" stroke-width="2"/>
<text x="816.0" y="70.75" text-anchor="middle" font-size="15" font-weight="600" fill="#12283f">FastAPI service</text>
<text x="816.0" y="87.25" text-anchor="middle" font-size="12.5" fill="#12283f">/incidents · live /events · /stream/status</text>
<rect x="666" y="122" width="300" height="64" rx="9" fill="#dfe8f5" stroke="#1e3f66" stroke-width="2"/>
<text x="816.0" y="146.75" text-anchor="middle" font-size="15" font-weight="600" fill="#12283f">Streamlit dashboard</text>
<text x="816.0" y="163.25" text-anchor="middle" font-size="12.5" fill="#12283f">ranked incidents · MITRE tags · health</text>
<rect x="666" y="198" width="300" height="64" rx="9" fill="#f0e8f6" stroke="#7a4a9e" stroke-width="2"/>
<text x="816.0" y="222.75" text-anchor="middle" font-size="15" font-weight="600" fill="#3d2352">Local LLM narrative</text>
<text x="816.0" y="239.25" text-anchor="middle" font-size="12.5" fill="#3d2352">phi3 on demand · 5.2 s GPU / 24.2 s CPU</text>
<rect x="40" y="428" width="320" height="96" rx="9" fill="#fbe9e7" stroke="#b1442e" stroke-width="2"/>
<text x="200.0" y="459.5" text-anchor="middle" font-size="17" font-weight="600" fill="#6d2317">Wazuh 4.9 in Docker</text>
<text x="200.0" y="477.0" text-anchor="middle" font-size="13.5" fill="#6d2317">the real manager, with its own</text>
<text x="200.0" y="494.5" text-anchor="middle" font-size="13.5" fill="#6d2317">rules and its own engine</text>
<rect x="430" y="428" width="320" height="96" rx="9" fill="#fbe9e7" stroke="#b1442e" stroke-width="2"/>
<text x="590.0" y="459.5" text-anchor="middle" font-size="17" font-weight="600" fill="#6d2317">One shared scorer</text>
<text x="590.0" y="477.0" text-anchor="middle" font-size="13.5" fill="#6d2317">the same code scores both</text>
<text x="590.0" y="494.5" text-anchor="middle" font-size="13.5" fill="#6d2317">systems, from the same lines</text>
<rect x="820" y="428" width="320" height="96" rx="9" fill="#fbe9e7" stroke="#b1442e" stroke-width="2"/>
<text x="980.0" y="459.5" text-anchor="middle" font-size="17" font-weight="600" fill="#6d2317">Robustness report</text>
<text x="980.0" y="477.0" text-anchor="middle" font-size="13.5" fill="#6d2317">the drop under camouflage,</text>
<text x="980.0" y="494.5" text-anchor="middle" font-size="13.5" fill="#6d2317">side by side, losses included</text>
<text x="14" y="32" font-size="14" font-weight="600" fill="#3f7d3f">Live sources</text>
<text x="288" y="32" font-size="14" font-weight="600" fill="#2c5f9e">Detection engine — always running</text>
<text x="666" y="32" font-size="14" font-weight="600" fill="#1e3f66">What the analyst uses</text>
