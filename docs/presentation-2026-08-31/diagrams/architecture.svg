<rect x="14" y="382" width="1152" height="168" rx="12" fill="#fdf5f3" stroke="#b1442e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="28" y="401" font-size="13.5" font-weight="600" fill="#b1442e">Comparison track — a separate package; the pipeline never imports it</text>
