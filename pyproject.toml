[project]
name = "log-anomaly-detector"
version = "0.1.0"
description = "LLM-powered log anomaly detector with MITRE ATT&CK narrative generation and adversarial robustness evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.66.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "drain3>=0.9.11",
]

[project.scripts]
logdet-preprocess  = "logdet.preprocessing:cli"
logdet-pipeline    = "logdet.pipeline:cli"
logdet-fit         = "logdet.fit:cli"
logdet-stream      = "logdet.stream:cli"
logdet-api         = "logdet.api:cli"
logdet-collector   = "logdet.collector_app:cli"
logdet-replay      = "logdet.replay:cli"
logdet-attack      = "logdet.attack:cli"
logdet-ecs         = "logdet.ecs:cli"
logdet-weblog      = "logdet.weblog:cli"
logdet-generate    = "logdet_eval.generate_logs:cli"
logdet-evaluate    = "logdet_eval.evaluate:cli"
logdet-adversarial = "logdet_eval.adversarial:cli"
logdet-samples     = "logdet_eval.export_samples:cli"
logdet-fetch-data  = "logdet_eval.datasets:cli"
logdet-corpus      = "logdet_eval.corpus_openssh:cli"
logdet-corpus-captured = "logdet_eval.corpus_captured:cli"
logdet-killpoint   = "logdet_eval.killpoint:cli"
logdet-paced-killpoint = "logdet_eval.paced_killpoint:cli"
logdet-killpoint-summary = "logdet_eval.killpoint_summary:cli"
logdet-templates   = "logdet_eval.template_report:cli"
logdet-sequence-report = "logdet_eval.sequence_report:cli"
logdet-suppression-report = "logdet_eval.suppression_report:cli"
logdet-adaptive = "logdet_eval.adaptive:cli"
logdet-adaptive-wazuh = "logdet_eval.adaptive_wazuh:cli"
logdet-bakeoff     = "logdet_eval.bakeoff:cli"
logdet-live-bakeoff = "logdet_eval.live_bakeoff:cli"
logdet-coverage    = "logdet_eval.coverage_report:cli"
logdet-faithfulness = "logdet_eval.faithfulness:cli"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "markdown>=3.10.3",
    "python-pptx>=1.0.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logdet", "src/logdet_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs the embedding model or a full pipeline run (deselect with -m 'not slow')",
    "llm: needs a running Ollama instance",
]
